name: Build Custom GKI Kernel with KernelSU & SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Custom 6.1 GKI Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 15360
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses5-dev libssl-dev libelf-dev bc liblz4-tool liblzma-dev python3 rsync \
            clang lld ccache

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync Android Common Kernel (ACK 6.1)
        run: |
          mkdir -p ~/ack-6.1
          cd ~/ack-6.1
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Integrate KernelSU-Next & SuSFS
        run: |
          cd ~/ack-6.1/common
          
          # Setup KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # Setup SuSFS Patches for GKI 6.1
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 ~/susfs
          cp ~/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU-Next/
          cp ~/susfs/kernel_patches/fs/* ./fs/
          cp ~/susfs/kernel_patches/include/linux/* ./include/linux/
          
          # Apply SuSFS patch to KernelSU
          cd KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..
          
          # Apply GKI SuSFS patch
          cp ~/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

      - name: Configure Kernel Features
        run: |
          cd ~/ack-6.1/common
          
          # Enable KernelSU and SuSFS
          scripts/config --file arch/arm64/configs/gki_defconfig \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -d KSU_SUSFS_ENABLE_LOG \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -e ZRAM_DEF_COMP_ZSTD \
            --set-str ZRAM_DEF_COMP "zstd" \
            -e OVERLAY_FS \
            -e OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW \
            -e HZ_300 \
            --set-val HZ 300 \
            -e TCP_CONG_BBR \
            --set-str DEFAULT_TCP_CONG "bbr" \
            -e WIREGUARD \
            -e USB_CONFIGFS_MASS_STORAGE

      - name: Build GKI Kernel
        run: |
          cd ~/ack-6.1
          LTO=thin tools/bazel run --config=fast //common:kernel_aarch64_dist

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 ~/AnyKernel3
          cd ~/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          cp ~/ack-6.1/out/kernel_aarch64/dist/Image ./
          gzip -n -k -f -9 Image > Image.gz
          zip -r9 ~/Custom_Kernel_TB373FU_OneUI9.zip * -x .git README.md

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kernel-TB373FU-OneUI9
          path: |
            ~/ack-6.1/out/kernel_aarch64/dist/Image
            ~/ack-6.1/out/kernel_aarch64/dist/Image.gz
            ~/Custom_Kernel_TB373FU_OneUI9.zip
