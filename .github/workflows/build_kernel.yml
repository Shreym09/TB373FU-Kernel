name: Build Custom GKI Kernel with KernelSU & SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Custom 6.1 GKI Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Move caches onto the big volume
        run: |
          # Bazel and ccache write to ~/.cache, which lives on the small root disk.
          # Point it at the workspace volume instead.
          mkdir -p "$GITHUB_WORKSPACE/.cache"
          rm -rf ~/.cache
          ln -s "$GITHUB_WORKSPACE/.cache" ~/.cache
          # /tmp is on the root disk too, so send temp files to the big volume
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/tmp" >> "$GITHUB_ENV"
          df -h / "$GITHUB_WORKSPACE"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses5-dev libssl-dev libelf-dev bc liblz4-tool liblzma-dev python3 rsync \
            clang lld ccache

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync Android Common Kernel (ACK 6.1)
        run: |
          # Print disk usage every 60s so a failure shows which disk filled up
          (while true; do sleep 60; echo "--- disk ---"; df -h / "$GITHUB_WORKSPACE"; done) &
          MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          mkdir -p "$GITHUB_WORKSPACE/ack-6.1"
          cd "$GITHUB_WORKSPACE/ack-6.1"
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle
          df -h / "$GITHUB_WORKSPACE"

      - name: Integrate KernelSU-Next (SuSFS branch) & SuSFS kernel patch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/ack-6.1/common"

          # KernelSU-Next fork that already has SuSFS built in (the one WildKernels builds with).
          # Full clone (no --depth) so the KernelSU version number can be computed from git history.
          git clone https://github.com/pershoot/KernelSU-Next.git -b dev-susfs KernelSU-Next
          # Bazel treats nested BUILD files as separate packages and would skip those sources
          find KernelSU-Next \( -name BUILD -o -name BUILD.bazel \) -not -path '*/.git/*' -delete

          # Hook the driver into the kernel tree (this is what KernelSU's setup.sh does)
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'CONFIG_KSU)' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          test -f drivers/kernelsu/Kconfig
          grep -rq KSU_SUSFS KernelSU-Next/kernel || echo "::warning::No SuSFS options found in KernelSU-Next kernel dir"

          # SuSFS kernel-side patch for GKI android14-6.1 (no '|| true': a failed hunk must stop the build)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 "$GITHUB_WORKSPACE/susfs"
          cp "$GITHUB_WORKSPACE"/susfs/kernel_patches/fs/* fs/
          cp "$GITHUB_WORKSPACE"/susfs/kernel_patches/include/linux/* include/linux/
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" .
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch
          rm -f 50_add_susfs_in_gki-android14-6.1.patch

      - name: Configure Kernel Features
        run: |
          cd "$GITHUB_WORKSPACE/ack-6.1/common"

          # Kleaf fails the build unless gki_defconfig is in exact 'savedefconfig' form.
          # We edit it with scripts/config, so turn that check off.
          sed -i 's/check_defconfig//' build.config.gki* || true
          grep -rl 'check_defconfig = "minimized"' BUILD.bazel ../build/kernel/kleaf 2>/dev/null \
            | xargs -r sed -i 's/check_defconfig = "minimized"/check_defconfig = "disabled"/'
          grep -n check_defconfig build.config.gki* BUILD.bazel || true

          # Enable KernelSU and SuSFS
          scripts/config --file arch/arm64/configs/gki_defconfig \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -d KSU_SUSFS_ENABLE_LOG \
            -e KPROBES \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -e ZRAM_DEF_COMP_ZSTD \
            --set-str ZRAM_DEF_COMP "zstd" \
            -e OVERLAY_FS \
            -e OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW \
            -e HZ_300 \
            --set-val HZ 300 \
            -e TCP_CONG_BBR \
            --set-str DEFAULT_TCP_CONG "bbr" \
            -e WIREGUARD \
            -e USB_CONFIGFS_MASS_STORAGE

      - name: Build GKI Kernel
        run: |
          (while true; do sleep 120; echo "--- disk ---"; df -h / "$GITHUB_WORKSPACE"; done) &
          MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE/ack-6.1"
          tools/bazel run --config=fast --verbose_failures //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/dist"
          ls -lh "$GITHUB_WORKSPACE/dist"
          df -h / "$GITHUB_WORKSPACE"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 "$GITHUB_WORKSPACE/AnyKernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          cp "$GITHUB_WORKSPACE/dist/Image" ./
          gzip -n -k -f -9 Image
          zip -r9 "$GITHUB_WORKSPACE/Custom_Kernel_TB373FU_OneUI9.zip" * -x .git README.md

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kernel-TB373FU-OneUI9
          path: |
            ${{ github.workspace }}/dist/Image
            ${{ github.workspace }}/AnyKernel3/Image.gz
            ${{ github.workspace }}/Custom_Kernel_TB373FU_OneUI9.zip
